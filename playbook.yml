- name: Configurar servidores Ubuntu
  hosts: servidores
  become: true

  tasks:
    - name: Actualizar los paquetes de APT
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Crear el usuario itla
      ansible.builtin.user:
        name: itla
        shell: /bin/bash
        create_home: true

    - name: Crear la carpeta app
      ansible.builtin.file:
        path: /app
        state: directory
        mode: "0755"

    - name: Crear el archivo hola.txt
      ansible.builtin.copy:
        dest: /app/hola.txt
        content: "Hola desde {{ inventory_hostname }}\n"
        mode: "0644"

    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present
